name: Faiz Radari Otonom Bot (09:00 - 21:00)

on:
  schedule:
    # Türkiye saati (UTC+3) ile 09:00, 11:00, 13:00, 15:00, 17:00, 19:00 ve 21:00
    - cron: '0 6,8,10,12,14,16,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-telegram-report:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Türkçe Destekli Fontları Kur
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Sıradaki Tabloyu Üret ve Telegram'a Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@faizradari"
        run: python bot.py --auto-slot

      - name: Güncel Oran Önbelleğini (rates_cache.json) Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates_cache.json
          git diff --staged --quiet || (git commit -m "Auto-update live bank rates cache" && git push)
