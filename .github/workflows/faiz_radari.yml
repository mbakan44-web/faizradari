name: Faiz Radari Otonom Bot (09:00 - 21:00)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Gönderilecek tablo konusu (ihtiyac, makas, konut, tasit, mevduat)'
        required: false
        default: 'auto'
  repository_dispatch:
    types: [trigger-report]
  schedule:
    # Yedek tetikleyici (UTC): 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00
    - cron: '0 6,8,10,12,14,16,18 * * *'

permissions:
  contents: write

concurrency:
  group: faiz-radari-publish
  cancel-in-progress: false

jobs:
  send-telegram-report:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Türkçe Destekli Fontları Kur
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Sıradaki Tabloyu Üret ve Telegram + X Hesaplarına Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@faizradari"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          TOPIC="${{ github.event.inputs.topic || github.event.client_payload.topic || 'auto' }}"
          if [ "$TOPIC" != "auto" ]; then
            python bot.py --auto-slot --topic="$TOPIC"
          else
            python bot.py --auto-slot
          fi

      - name: Güncel Oran Önbelleğini (rates_cache.json) Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates_cache.json
          git diff --staged --quiet || (git commit -m "Auto-update live bank rates cache" && git push)
